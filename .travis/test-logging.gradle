// Prints per-test failures/skips and a per-task total so the CI log states how many tests ran and passed.
allprojects {
	tasks.withType(Test) { t ->
		t.testLogging {
			events 'skipped', 'failed'
			exceptionFormat 'full'
		}
		t.afterSuite { desc, result ->
			if (desc.parent == null) {
				// lifecycle logger: the build's captureStandardOutput(LogLevel.INFO) hides println here
				t.logger.lifecycle "TEST SUMMARY ${t.path}: ${result.resultType} - ${result.testCount} tests, " +
						"${result.successfulTestCount} passed, ${result.failedTestCount} failed, " +
						"${result.skippedTestCount} skipped"
			}
		}
	}
}
