name: seal-build

# Build-and-pack only: the test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8.0.232'
      - name: Build spring-integration-core jar
        run: ./gradlew :spring-integration-core:jar --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: spring-integration-core-jar
          path: spring-integration-core/build/libs/spring-integration-core-5.2.3.RELEASE.jar
          if-no-files-found: error
